<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halaman Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>Form Pendaftaran</h1>
      <p class="subtitle">Isi data berikut, lalu tekan Daftar.</p>
      <form id="form-daftar" action="detail.html" method="GET">
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Contoh: Khairul Rijal Syauqi">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="khairul@gmail.com">

        <label for="tgl">Tanggal lahir</label>
        <input type="date" id="tgl" name="tgl_lahir">

        <label>Jenis kelamin</label>
        <div class="radio-group">
          <label><input type="radio" name="jk" value="L"> Laki-laki</label>
          <label><input type="radio" name="jk" value="P"> Perempuan</label>
        </div>

        <label for="jurusan">Jurusan</label>
        <select id="jurusan" name="jurusan">
          <option value="Teknik Informatika">Teknik Informatika</option>
          <option value="Teknik Sipil">Teknik Sipil</option>
          <option value="Teknik Elektro">Teknik Elektro</option>
        </select>

        <button type="submit" class="btn">Daftar</button>
      </form>
    </div>
  </div>
</body>
</html>
